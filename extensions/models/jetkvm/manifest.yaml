manifestVersion: 1

name: "@sntxrr/jetkvm"
version: "2026.10.16.1"
description: "Operate a JetKVM from swamp: health checks and Tailscale updates. The JetKVM web UI does almost everything over a WebRTC data channel, so video, USB, version and settings are not on HTTP and there is no snapshot endpoint; this model reads the unauthenticated /metrics page for the app version and NTP state, and everything else over SSH as root (developer mode, key auth, host key pinned or already known; never trust-on-first-use). health flags app and system firmware updates (via JetKVM's release API), USB gadget not enumerated, low disk, clock skew, and Tailscale down, offline, out of date or missing its boot script. The device has no CA store, so `tailscale update` cannot run on it: tailscale update downloads the official arm tarball on the swamp host, checks its sha256, streams it over SSH, backs up the running binaries, swaps them in the layout `tailscale configure jetkvm` expects, restarts tailscaled without a reboot, and rolls back by itself unless the node rejoins Running and online with the same tailnet IP. It is a dry run unless apply is true."
repository: "https://github.com/sntxrr/swamp-jetkvm"
license: MIT

paths:
  base: manifest

models:
  - jetkvm.ts

additionalFiles:
  - README.md
  - LICENSE.md

labels:
  - jetkvm
  - kvm
  - ip-kvm
  - tailscale
  - out-of-band
  - homelab
